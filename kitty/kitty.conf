font_family      FiraCode Nerd Font
font_size        14
term             xterm-256color
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
tab_bar_edge     top
tab_bar_min_tabs 1

# all tab shortcuts stay on ctrl+shift (kitty_mod): tmux on mac-studio uses
# only its prefix (C-b / C-a), C-l and M-x in copy mode, and without
# extended-keys it cannot see ctrl+shift at all, so nothing collides.
# ctrl+shift+1..9 jump to a tab (default: split windows, unused here)
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
